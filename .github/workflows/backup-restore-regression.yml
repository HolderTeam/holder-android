name: Backup/Restore Regression

# Manual only, deliberately -- see scripts/backup_restore_regression.sh's own top-of-file
# comment for why this is slow (uninstall/reinstall cycles, real WorkManager scheduler
# polling) and at the mercy of real backup-subsystem timing, and so belongs before a release
# rather than gating every push/PR the way android.yml's other jobs do.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-restore-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache

    steps:
      - name: Check out holder-android
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null

      # Same API 33 x86_64 image as the managed-device-tests job's own "current API" leg, and
      # the same one the emulator memory note prefers locally (Galaxy_S20_FE, API 33) over a
      # beta image, for the same reason: this needs a stable, non-flaky boot, not the newest
      # image.
      - name: Install Android emulator, system image, and NDK
        run: |
          sdkmanager "emulator" "platform-tools" "platforms;android-33" \
            "system-images;android-33;google_apis;x86_64" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore x86_64 vcpkg binary package cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-android-x86_64-${{ runner.os }}-${{ hashFiles('submodules/holder-core/vcpkg.json') }}
          restore-keys: |
            vcpkg-android-x86_64-${{ runner.os }}-

      - name: Install vcpkg build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -Pholder.android.abis=x86_64

      - name: Save x86_64 vcpkg binary package cache
        if: success() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-android-x86_64-${{ runner.os }}-${{ hashFiles('submodules/holder-core/vcpkg.json') }}

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd \
            -n backup_regression \
            -k "system-images;android-33;google_apis;x86_64" \
            -d pixel_5 \
            --force

      - name: Boot emulator
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd backup_regression \
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot &
          adb wait-for-device

          boot_completed=""
          for _ in $(seq 1 60); do
            boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [[ "${boot_completed}" == "1" ]] && break
            sleep 5
          done
          if [[ "${boot_completed}" != "1" ]]; then
            echo "Emulator did not finish booting within the timeout" >&2
            exit 1
          fi
          # Clears the lock screen some system images boot with, which would otherwise sit in
          # front of every app launch the script drives.
          adb shell input keyevent 82

      - name: Run backup/restore regression script
        run: ./scripts/backup_restore_regression.sh --apk app/build/outputs/apk/debug/app-debug.apk

      - name: Dump logcat on failure
        if: failure()
        run: adb logcat -d > logcat.txt || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: holder-android-backup-restore-regression-logcat
          path: logcat.txt
          if-no-files-found: ignore
          retention-days: 7
