name: Backup/Restore Regression

# Manual only, deliberately -- see scripts/backup_restore_regression.sh's own top-of-file
# comment for why this is slow (uninstall/reinstall cycles, real WorkManager scheduler
# polling) and at the mercy of real backup-subsystem timing, and so belongs before a release
# rather than gating every push/PR the way android.yml's other jobs do.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-restore-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache

    steps:
      - name: Check out holder-android
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null

      # Same API 33 x86_64 image as the managed-device-tests job's own "current API" leg, and
      # the same one the emulator memory note prefers locally (Galaxy_S20_FE, API 33) over a
      # beta image, for the same reason: this needs a stable, non-flaky boot, not the newest
      # image.
      - name: Install Android emulator, system image, and NDK
        run: |
          sdkmanager "emulator" "platform-tools" "platforms;android-33" \
            "system-images;android-33;google_apis;x86_64" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore x86_64 vcpkg binary package cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-android-x86_64-${{ runner.os }}-${{ hashFiles('submodules/holder-core/vcpkg.json') }}
          restore-keys: |
            vcpkg-android-x86_64-${{ runner.os }}-

      - name: Install vcpkg build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -Pholder.android.abis=x86_64

      - name: Save x86_64 vcpkg binary package cache
        if: success() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-android-x86_64-${{ runner.os }}-${{ hashFiles('submodules/holder-core/vcpkg.json') }}

      # ANDROID_AVD_HOME pinned explicitly and identically for this step and the next -- first
      # real run of this workflow hit `avdmanager create avd` reporting success with no error,
      # then `emulator -avd backup_regression` failing outright with "Unknown AVD name... no
      # file backup_regression.ini in $HOME/.android/avd", i.e. the two tools disagreed on
      # where an AVD lives. Also dropped `-d pixel_5`: nothing here depends on a specific
      # device skin (every tap target is found dynamically via uiautomator dump, not hardcoded
      # coordinates), so it's one less variable in a step that just failed once for an
      # unexplained reason.
      - name: Create AVD
        env:
          ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | avdmanager create avd \
            -n backup_regression \
            -k "system-images;android-33;google_apis;x86_64" \
            --force
          echo "--- avdmanager list avd (confirming it's actually there) ---"
          avdmanager list avd

      - name: Boot emulator
        env:
          ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd backup_regression \
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot \
            > emulator.log 2>&1 &
          emulator_pid=$!

          # Bounded and liveness-checked -- the first real run of this workflow hung here for
          # the full 60-minute job timeout: `adb wait-for-device` blocks forever if the
          # emulator process died right after backgrounding (as it did, from the AVD-lookup
          # mismatch above) rather than ever actually starting. Checking the process is still
          # alive on every iteration turns that failure mode into a fast, clear one instead of
          # a silent hour-long hang. `adb shell` against no device yet just errors immediately
          # rather than blocking, so no separate wait-for-device call is needed at all.
          boot_completed=""
          for _ in $(seq 1 60); do
            if ! kill -0 "${emulator_pid}" 2>/dev/null; then
              echo "Emulator process exited early -- emulator.log:" >&2
              cat emulator.log >&2
              exit 1
            fi
            boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [[ "${boot_completed}" == "1" ]] && break
            sleep 5
          done
          if [[ "${boot_completed}" != "1" ]]; then
            echo "Emulator did not finish booting within the timeout -- emulator.log:" >&2
            cat emulator.log >&2
            exit 1
          fi
          # Clears the lock screen some system images boot with, which would otherwise sit in
          # front of every app launch the script drives.
          adb shell input keyevent 82

      - name: Run backup/restore regression script
        run: ./scripts/backup_restore_regression.sh --apk app/build/outputs/apk/debug/app-debug.apk

      - name: Dump logcat on failure
        if: failure()
        run: adb logcat -d > logcat.txt || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: holder-android-backup-restore-regression-diagnostics
          path: |
            logcat.txt
            emulator.log
          if-no-files-found: ignore
          retention-days: 7
